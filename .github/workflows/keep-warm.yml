# Best-effort boot check for the live demo, not a keep-alive.
#
# Both demo services run on Render's free tier, which spins a service down
# after 15 idle minutes. This job was written to ping every 10 minutes so
# they would never sleep, but GitHub throttles scheduled runs on quiet
# repositories: over 9/8 to 9/23 it fired 100 times with a median gap of
# about 3.4 hours and never twice inside 15 minutes. So every ping is a cold
# start and nothing stays warm. What actually wakes n8n is the console: the
# Ticket flow tab polls GET /demo/warm on the triage server, which probes
# n8n and holds the Send button until it answers.
#
# The job still earns its place as a boot check for the hosted n8n. It runs
# only in a demo window, weekdays 7am to 8pm ET (11-23 UTC during EDT; in
# EST the same line means 6am to 7pm). Render pools free instance hours
# across the workspace, and two services awake around the clock would
# exceed the monthly allowance and get both suspended.
#
# A cold start takes 60 to 90 seconds and a restart mid-boot answers 502
# for a while, so five attempts with a 60 s budget each and 20 s between
# them tell a slow boot apart from a service that is genuinely down.
name: Keep warm

on:
  schedule:
    - cron: "*/10 11-23 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the triage server and the n8n instance behind its Ticket flow tab
        url:
          - https://edi-failure-triage.onrender.com/health
          - https://edi-triage-n8n.onrender.com/healthz
    steps:
      - name: Ping the deployed service
        env:
          HEALTH_URL: ${{ matrix.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if status=$(curl -sfS --max-time 60 -o /dev/null -w '%{http_code}' "$HEALTH_URL"); then
              echo "Attempt $attempt: HTTP $status, the service is up."
              exit 0
            fi
            echo "Attempt $attempt did not get a healthy response."
            if [ "$attempt" -lt 5 ]; then
              sleep 20
            fi
          done
          echo "No healthy response after 5 attempts over about six minutes."
          exit 1

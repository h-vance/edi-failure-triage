services:
  - type: web
    name: edi-failure-triage
    runtime: python
    repo: https://github.com/h-vance/edi-failure-triage
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BEDROCK_MOCK
        value: "true"
      # Mock mode costs nothing per call, so the limit only needs to stop
      # runaway scripts, not a person clicking through every fixture.
      - key: RATE_LIMIT_REQUESTS
        value: "200"
      - key: CORS_ORIGINS
        value: "https://edi-failure-triage.onrender.com,http://localhost:8080,http://127.0.0.1:8080"
      - key: MCP_ALLOWED_HOSTS
        value: "edi-failure-triage.onrender.com,127.0.0.1:*,localhost:*,[::1]:*"
      - key: MCP_ALLOWED_ORIGINS
        value: "https://edi-failure-triage.onrender.com,http://127.0.0.1:*,http://localhost:*,http://[::1]:*"
